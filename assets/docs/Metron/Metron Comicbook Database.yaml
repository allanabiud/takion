  /api/issue/:

    get:

      operationId: api_issue_list

      description: |-
        list:
        Return a list of all the issues.

        retrieve:
        Returns the information of an individual issue.

        Note: cover_hash is a Perceptual hashing created with
        ImageHash. https://github.com/JohannesBuchner/imagehash

      parameters:
      - in: query
        name: alt_number
        schema:
          type: string
        description: Alternate Number
      - in: query
        name: character_id
        schema:
          type: integer
        description: Character Metron ID
      - in: query
        name: cover_hash
        schema:
          type: string
        description: Cover Hash
      - in: query
        name: cover_month
        schema:
          type: number
        description: Cover Month
      - in: query
        name: cover_year
        schema:
          type: number
        description: Cover Year
      - in: query
        name: creator_id
        schema:
          type: integer
        description: Creator Metron ID
      - in: query
        name: cv_id
        schema:
          type: integer
        description: Comic Vine ID
      - in: query
        name: foc_date
        schema:
          type: string
          format: date
      - in: query
        name: foc_date_range_after
        schema:
          type: string
          format: date
      - in: query
        name: foc_date_range_before
        schema:
          type: string
          format: date
      - in: query
        name: gcd_id
        schema:
          type: integer
        description: Grand Comics Database ID
      - in: query
        name: imprint_id
        schema:
          type: integer
        description: Imprint Metron ID
      - in: query
        name: imprint_name
        schema:
          type: string
        description: Imprint Name
      - in: query
        name: missing_cv_id
        schema:
          type: boolean
      - in: query
        name: missing_gcd_id
        schema:
          type: boolean
      - in: query
        name: modified_gt
        schema:
          type: string
          format: date-time
        description: Greater than Modified DateTime
      - in: query
        name: number
        schema:
          type: string
        description: Issue Number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: publisher_id
        schema:
          type: integer
        description: Publisher Metron ID
      - in: query
        name: publisher_name
        schema:
          type: string
        description: Publisher Name
      - in: query
        name: rating
        schema:
          type: string
        description: Rating
      - in: query
        name: role_id
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: series_id
        schema:
          type: integer
        description: Series Metron ID
      - in: query
        name: series_name
        schema:
          type: string
        description: Series Name
      - in: query
        name: series_volume
        schema:
          type: integer
        description: Series Volume Number
      - in: query
        name: series_year_began
        schema:
          type: integer
        description: Series Beginning Year
      - in: query
        name: sku
        schema:
          type: string
        description: Distributor SKU
      - in: query
        name: store_date
        schema:
          type: string
          format: date
      - in: query
        name: store_date_range_after
        schema:
          type: string
          format: date
      - in: query
        name: store_date_range_before
        schema:
          type: string
          format: date
      - in: query
        name: team_id
        schema:
          type: integer
        description: Team Metron ID
      - in: query
        name: universe_id
        schema:
          type: integer
        description: Universe Metron ID
      - in: query
        name: upc
        schema:
          type: string
        description: UPC Code
      - in: query
        name: upc_starts_with
        schema:
          type: string
        description: UPC Code starts with (e.g. the 12-digit UPC-A read by a mobile
          scanner that strips the 5-digit EAN supplemental)

      tags:
      - api

      security:
      - basicAuth: []
      - cookieAuth: []

      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssueListList'
          description: ''

