          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        list_type:
          type: string
          readOnly: true
        is_private:
          type: boolean
          description: Whether this list is private (only visible to the owner)
        attribution_source:
          description: |-
            Source where this reading list information was obtained

            * `CBRO` - Comic Book Reading Orders
            * `CMRO` - Complete Marvel Reading Orders
            * `CBH` - Comic Book Herald
            * `CBT` - Comic Book Treasury
            * `MG` - Marvel Guides
            * `HTLC` - How To Love Comics
            * `LOCG` - League of ComicGeeks
            * `OTHER` - Other
          oneOf:
          - $ref: '#/components/schemas/AttributionSourceEnum'
          - $ref: '#/components/schemas/BlankEnum'
        average_rating:
          type: number
          format: double
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        modified:
