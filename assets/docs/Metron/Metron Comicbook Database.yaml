openapi: 3.0.3

info:
  title: Metron Comicbook Database
  version: 1.0.0
  description: API to retrieve comic book data
  contact:
    name: API Support
    email: admin@metron.cloud
  license:
    name: Creative Commons License
    url: https://creativecommons.org/licenses/by-sa/4.0/

paths:

  /api/arc/:

    get:

      operationId: api_arc_list

      description: |-
        list:
        Returns a list of all the story arcs.

        retrieve:
        Returns the information of an individual story arc.

      parameters:
      - in: query
        name: cv_id
        schema:
          type: integer
        description: Comic Vine ID
      - in: query
        name: gcd_id
        schema:
          type: integer
        description: Grand Comics Database ID
      - in: query
        name: modified_gt
        schema:
          type: string
          format: date-time
        description: Greater than Modified DateTime
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer

      tags:
      - api

      security:
      - basicAuth: []
      - cookieAuth: []

      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArcListList'
          description: ''

  /api/arc/{id}/:

    get:

      operationId: api_arc_retrieve

