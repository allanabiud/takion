components:
  schemas:

    Arc:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        desc:
          type: string
          title: Description
        image:
          type: string
          format: uri
          nullable: true
        cv_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Comic Vine ID
        gcd_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        resource_url:
          type: string
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - modified
      - name
      - resource_url

    ArcList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - modified
      - name

    AssociatedSeries:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        series:
          type: string
      required:
      - id
      - series

    AttributionSourceEnum:
      enum:
      - CBRO
      - CMRO
      - CBH
      - CBT
      - MG
      - HTLC
      - LOCG
      - OTHER
      type: string
      description: |-
        * `CBRO` - Comic Book Reading Orders
        * `CMRO` - Complete Marvel Reading Orders
        * `CBH` - Comic Book Herald
        * `CBT` - Comic Book Treasury
        * `MG` - Marvel Guides
        * `HTLC` - How To Love Comics
        * `LOCG` - League of ComicGeeks
        * `OTHER` - Other

    BasicImprint:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name

    BasicPublisher:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name

    BlankEnum:
      enum:
      - ''

    CharacterList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - modified
      - name

    CharacterRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        alias:
          type: array
          items:
            type: string
            maxLength: 100
        desc:
          type: string
          title: Description
        image:
          type: string
          format: uri
          nullable: true
        creators:
          type: array
          items:
            $ref: '#/components/schemas/CreatorList'
          readOnly: true
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamList'
          readOnly: true
        universes:
          type: array
          items:
            $ref: '#/components/schemas/UniverseList'
          readOnly: true
        cv_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Comic Vine ID
        gcd_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        resource_url:
          type: string
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - creators
      - id
      - modified
      - name
      - resource_url
      - teams
      - universes

    CreatorList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - modified
      - name

    CreditRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        creator:
          type: string
          readOnly: true
        role:
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
      - creator
      - id
      - role

    CurrencyEnum:
      enum:
      - USD
      - GBP
      type: string
      description: |-
        * `USD` - USD
        * `GBP` - GBP

    DesiredGradeEnum:
      enum:
      - 10.0
      - 9.9
      - 9.8
      - 9.6
      - 9.4
      - 9.2
      - 9.0
      - 8.5
      - 8.0
      - 7.5
      - 7.0
      - 6.5
      - 6.0
      - 5.5
      - 5.0
      - 4.5
      - 4.0
      - 3.5
      - 3.0
      - 2.5
      - 2.0
      - 1.8
      - 1.5
      - 1.0
      - 0.5
      type: number
      description: |-
        * `10.0` - 10.0 (Gem Mint)
        * `9.9` - 9.9 (Mint)
        * `9.8` - 9.8 (NM/M - Near Mint/Mint)
        * `9.6` - 9.6 (NM+ - Near Mint+)
        * `9.4` - 9.4 (NM - Near Mint)
        * `9.2` - 9.2 (NM- - Near Mint-)
        * `9.0` - 9.0 (VF/NM - Very Fine/Near Mint)
        * `8.5` - 8.5 (VF+ - Very Fine+)
        * `8.0` - 8.0 (VF - Very Fine)
        * `7.5` - 7.5 (VF- - Very Fine-)
        * `7.0` - 7.0 (FN/VF - Fine/Very Fine)
        * `6.5` - 6.5 (FN+ - Fine+)
        * `6.0` - 6.0 (FN - Fine)
        * `5.5` - 5.5 (FN- - Fine-)
        * `5.0` - 5.0 (VG/FN - Very Good/Fine)
        * `4.5` - 4.5 (VG+ - Very Good+)
        * `4.0` - 4.0 (VG - Very Good)
        * `3.5` - 3.5 (VG- - Very Good-)
        * `3.0` - 3.0 (GD/VG - Good/Very Good)
        * `2.5` - 2.5 (GD+ - Good+)
        * `2.0` - 2.0 (GD - Good)
        * `1.8` - 1.8 (GD- - Good-)
        * `1.5` - 1.5 (FR/GD - Fair/Good)
        * `1.0` - 1.0 (FR - Fair)
        * `0.5` - 0.5 (PR - Poor)

    Genre:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 25
      required:
      - id
      - name

    ImprintList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - modified
      - name

    ImprintRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        founded:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: Year Founded
        desc:
          type: string
          title: Description
        image:
          type: string
          format: uri
          nullable: true
          title: Logo
        cv_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Comic Vine ID
        gcd_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        publisher:
          allOf:
          - $ref: '#/components/schemas/BasicPublisher'
          readOnly: true
        resource_url:
          type: string
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - modified
      - name
      - publisher
      - resource_url

    IssueList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        series:
          allOf:
          - $ref: '#/components/schemas/IssueListSeries'
          readOnly: true
        number:
          type: string
          maxLength: 25
        issue:
          type: string
        cover_date:
          type: string
          format: date
        store_date:
          type: string
          format: date
          nullable: true
          title: In Store Date
        image:
          type: string
          format: uri
          nullable: true
          title: Cover
        cover_hash:
          type: string
          maxLength: 16
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - cover_date
      - id
      - issue
      - modified
      - number
      - series

    IssueListSeries:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        volume:
          type: integer
          maximum: 32767
          minimum: 0
          title: Volume Number
        year_began:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - id
      - name
      - volume
      - year_began

    IssueRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        publisher:
          allOf:
          - $ref: '#/components/schemas/BasicPublisher'
          readOnly: true
        imprint:
          allOf:
          - $ref: '#/components/schemas/BasicImprint'
          readOnly: true
        series:
          allOf:
          - $ref: '#/components/schemas/IssueSeries'
          readOnly: true
        number:
          type: string
          maxLength: 25
        alt_number:
          type: string
          title: Alternative Number
          maxLength: 25
        title:
          type: string
          title: Collection Title
          maxLength: 255
        name:
          type: array
          items:
            type: string
            title: Story Title
            maxLength: 150
        cover_date:
          type: string
          format: date
        store_date:
          type: string
          format: date
          nullable: true
          title: In Store Date
        foc_date:
          type: string
          format: date
          nullable: true
          title: Final Order Cutoff Date
        price:
          oneOf:
          - type: string
            format: decimal
            pattern: ^\d+\.\d{2}$
            example: '3.99'
            description: Decimal string — defaults to USD (e.g. '3.99').
          - type: object
            properties:
              amount:
                type: number
                example: 3.99
              currency:
                type: string
                enum:
                - USD
                - GBP
                example: GBP
            required:
            - amount
            - currency
            description: Object format for non-USD prices (e.g. GBP for UK publishers).
          description: 'Cover price. For reads, returns the amount as a decimal string;
            see price_currency for the currency. For writes, pass a plain decimal
            string (defaults to USD) or {"amount": 3.99, "currency": "GBP"} for UK
            publishers. Supported currencies: USD, GBP.'
          nullable: true
          readOnly: true
        price_currency:
          type: string
          description: Return the currency code for the price field.
          readOnly: true
        rating:
          allOf:
          - $ref: '#/components/schemas/Rating'
          readOnly: true
        sku:
          type: string
          title: Distributor SKU
          maxLength: 12
        isbn:
          type: string
          maxLength: 13
        upc:
          type: string
          title: UPC Code
          maxLength: 20
        page:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          title: Page Count
        desc:
          type: string
          title: Description
        image:
          type: string
          format: uri
          nullable: true
          title: Cover
        cover_hash:
          type: string
          maxLength: 16
        average_rating:
          type: number
          format: double
          maximum: 10
          minimum: -10
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        arcs:
          type: array
          items:
            $ref: '#/components/schemas/ArcList'
          readOnly: true
        credits:
          type: array
          items:
            $ref: '#/components/schemas/CreditRead'
          readOnly: true
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterList'
          readOnly: true
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamList'
          readOnly: true
        universes:
          type: array
          items:
            $ref: '#/components/schemas/UniverseList'
          readOnly: true
        reprints:
          type: array
          items:
            $ref: '#/components/schemas/Reprint'
          readOnly: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantsIssue'
          readOnly: true
        cv_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Comic Vine ID
        gcd_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        resource_url:
          type: string
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - arcs
      - average_rating
      - characters
      - cover_date
      - credits
      - id
      - imprint
      - modified
      - number
      - price
      - price_currency
      - publisher
      - rating
      - rating_count
      - reprints
      - resource_url
      - series
      - teams
      - universes
      - variants

    IssueSeries:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        sort_name:
          type: string
          maxLength: 255
        volume:
          type: integer
