            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
      required:
      - id
      - username

    VariantsIssue:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        price:
          oneOf:
          - type: string
            format: decimal
            pattern: ^\d+\.\d{2}$
            example: '3.99'
            description: Decimal string — defaults to USD (e.g. '3.99').
          - type: object
            properties:
              amount:
                type: number
                example: 3.99
              currency:
                type: string
                enum:
                - USD
                - GBP
                example: GBP
            required:
            - amount
            - currency
            description: Object format for non-USD prices (e.g. GBP for UK publishers).
          description: 'Cover price. For reads, returns the amount as a decimal string;
            see price_currency for the currency. For writes, pass a plain decimal
            string (defaults to USD) or {"amount": 3.99, "currency": "GBP"} for UK
            publishers. Supported currencies: USD, GBP.'
          nullable: true
          readOnly: true
        sku:
          type: string
          title: Distributor SKU
          maxLength: 12
        upc:
          type: string
          title: UPC Code
          maxLength: 20
        image:
          type: string
          format: uri
          title: Variant Cover
      required:
      - image
      - price
