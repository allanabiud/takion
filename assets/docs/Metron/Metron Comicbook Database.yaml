  /api/reading_list/:

    get:

      operationId: api_reading_list_list

      description: |-
        list:
        Returns a list of reading lists based on user permissions.
        Requires authentication.
        - Authenticated users: Public lists + own lists
        - Admin users: Public lists + own lists + Metron's lists

        retrieve:
        Returns the information of an individual reading list.
        Requires authentication.

      parameters:
      - in: query
        name: attribution_source
        schema:
          type: string
          enum:
          - CBH
          - CBRO
          - CBT
          - CMRO
          - HTLC
          - LOCG
          - MG
          - OTHER
        description: |-
          Source where this reading list information was obtained

          * `CBRO` - Comic Book Reading Orders
          * `CMRO` - Complete Marvel Reading Orders
          * `CBH` - Comic Book Herald
          * `CBT` - Comic Book Treasury
          * `MG` - Marvel Guides
          * `HTLC` - How To Love Comics
          * `LOCG` - League of ComicGeeks
          * `OTHER` - Other
      - in: query
        name: average_rating__gte
        schema:
          type: number
        description: Minimum Rating
      - in: query
        name: is_private
        schema:
          type: boolean
      - in: query
        name: list_type
        schema:
          type: string
          enum:
          - CHARACTERS
          - CREATOR
          - EVENT
          - MASTER
          - STORY
          - TEAMS
        description: |-
          The type of reading list

          * `CREATOR` - Creator
          * `EVENT` - Event
          * `STORY` - Story
          * `CHARACTERS` - Characters
          * `TEAMS` - Teams
          * `MASTER` - Master
      - in: query
        name: modified_gt
        schema:
          type: string
          format: date-time
        description: Greater than Modified DateTime
      - in: query
        name: name
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: publisher
        schema:
          type: string
        description: Publisher
      - in: query
        name: user
        schema:
          type: integer
      - in: query
        name: username
        schema:
          type: string

      tags:
      - api

      security:
      - basicAuth: []
      - cookieAuth: []

      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReadingListListList'
          description: ''

