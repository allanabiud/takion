name: takion
description: "Android app for Metron-powered comic pull-list and collection tracking."
publish_to: "none"

version: 1.3.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  dio: ^5.9.1
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.15
  synchronized: ^3.4.0
  clock: ^1.1.1
  flex_color_scheme: ^8.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0
  workmanager: ^0.9.0+3

  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  auto_route: ^11.1.0
  flash: ^3.1.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  share_plus: ^13.2.1
  connectivity_plus: ^7.1.1
  lucide_icons_flutter: ^3.1.13
  gal: ^2.3.2
  google_sign_in: ^6.2.2
  http: ^1.3.0

  permission_handler: ^12.0.1
  mobile_scanner: ^6.0.2
  timelines_plus: ^2.0.0
  uuid: ^4.5.3
  file_picker: ^12.0.0-0
  flutter_svg: ^2.0.17
  talker: ^5.1.19
  talker_flutter: ^5.1.19
  flutter_markdown: ^0.7.7+1
  markdown: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  build_runner: ^2.11.1
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  auto_route_generator: ^10.4.0
  drift_dev: ^2.23.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - CHANGELOG.md

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/logo.png
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/branding/logo.png
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  color: "#121212"
  image: assets/splash/splash.png
  android: true
  ios: false
  android_gravity: center
  fullscreen: true
  android_12:
    color: "#121212"
    image: assets/splash/splash.png
    icon_background_color: "#121212"
