name: takion
description: "Android app for Metron-powered comic pull-list and collection tracking."
publish_to: 'none'

version: 0.7.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  dio: ^5.9.1
  path_provider: ^2.1.5
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  synchronized: ^3.4.0
  flex_color_scheme: ^8.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.0
  workmanager: ^0.9.0+3

  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  auto_route: ^11.1.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.2
  flash: ^3.1.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  package_info_plus: ^8.3.0
  share_plus: ^11.0.0
  connectivity_plus: ^7.1.1
  image_picker: ^1.2.0
  lucide_icons_flutter: ^3.1.13
  lottie: ^3.3.0
  gal: ^2.3.2
  google_sign_in: ^6.2.2
  googleapis: ^13.1.0
  permission_handler: ^12.0.1
  timelines_plus: ^2.0.0
  uuid: ^4.5.3
  file_picker: ^11.0.2
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  build_runner: ^2.11.1
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  hive_ce_generator: ^1.11.0
  auto_route_generator: ^10.4.0
  shared_preferences: ^2.5.4


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Regular.ttf
        - asset: fonts/Rubik-Bold.ttf
          weight: 700
        - asset: fonts/Rubik-Medium.ttf
          weight: 500
        - asset: fonts/Rubik-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/icon.png
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/images/icon.png
  adaptive_icon_foreground_inset: 20

flutter_native_splash:
  color: "#121212"
  image: assets/images/splash.png
  android: true
  ios: false
  android_gravity: center
  fullscreen: true
  android_12:
    color: "#121212"
    image: assets/images/splash.png
    icon_background_color: "#121212"
